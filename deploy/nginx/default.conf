# ============================================================
# 站点配置：静态资源 + API 反代 + SSE 专项
# ============================================================
upstream backend {
    server api:8000;
    keepalive 32;          # 复用后端连接，减少握手开销
}

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # ---------- 前端静态资源 ----------
    location / {
        # SPA 路由回退：/documents 这类路径在磁盘上没有对应文件，
        # 必须回落到 index.html 交给 vue-router 处理，否则刷新页面就 404。
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的构建产物可以长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html 绝不能缓存 —— 否则前端发版后用户拿到的还是旧壳子
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ---------- ★ SSE 专项（必须放在通用 /api/ 之前）----------
    # 问答接口是 text/event-stream 长连接。nginx 默认会缓冲响应体，
    # 表现是「前端一直转圈，最后一次性吐出全部内容」—— SSE 完全失效。
    location /api/v1/qa/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_buffering    off;      # ★ 关缓冲，事件才能逐个到达
        proxy_cache        off;
        proxy_read_timeout 300s;     # 问答墙钟上限 120s，留足余量
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    # ---------- ★ 引用图片静态代理（S4 新增）----------
    # citation.image_path 存的是容器内路径（/app/storage/parsed/{doc}/v{n}/images/x.jpg），
    # compose 把宿主 ./storage 只读挂到本容器的 /usr/share/nginx/storage。
    # 前端剥掉 /app/storage 前缀后请求 /storage/parsed/...，这里直接回静态文件。
    location /storage/ {
        alias /usr/share/nginx/storage/;
        expires 1h;
        add_header Cache-Control "public";
        access_log off;
    }

    # ---------- 通用 API 反代 ----------
    location /api/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 健康检查（给容器 healthcheck 用，不打访问日志）
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
