# ============================================================
# nginx 主配置
# ------------------------------------------------------------
# 相对官方默认配置只改了两处，都是为了配合本项目的约束：
#   client_max_body_size 200m  —— 与 config.yaml 的 ingest.max_file_size_mb 对齐
#   keepalive_timeout 65s      —— SSE 长连接需要，默认值偏短
# ============================================================
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;

    # SSE：单个问答最长 120s（agent.max_wall_clock_sec），留足余量
    keepalive_timeout  65s;

    # ★ 必须 >= ingest.max_file_size_mb(200)，否则上传 PPT 会被 nginx 直接拒掉，
    #   而前端只会看到一个含义不明的 413。
    client_max_body_size 200m;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    include /etc/nginx/conf.d/*.conf;
}
